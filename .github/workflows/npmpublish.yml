name: Node.js Package

on:
  pull_request:
    branches:
      - master
      - Release
  push:
    branches:
      - master
      - Release
  release:
    types:
      - created

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      odhin_artifact_ready: ${{ steps.odhin_site.outcome == 'success' }}
      evidence_url: ${{ steps.playwright_evidence.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
      - run: corepack enable && yarn --version
      - run: yarn install
      - run: yarn lint
      - run: yarn build:library
      - run: yarn test
      - run: yarn test:e2e:typecheck
      - run: yarn node --test e2e/reporters/odhin-report-enhancer.node-check.cjs
      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium firefox webkit
      - name: Run Playwright smoke
        env:
          PLAYWRIGHT_REPORTERS: dot,html,junit,odhin
          PW_ODHIN_OUTPUT: test-results/odhin
          PW_ODHIN_INDEX: common-lib-playwright.html
        run: yarn playwright test
      - name: Upload Playwright evidence
        id: playwright_evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-lib-playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

      - name: Prepare Odhín site
        id: odhin_prepare
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 568 && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('test-results/odhin/common-lib-playwright.html') != ''
        run: |
          test -s test-results/odhin/common-lib-playwright.html
          node -e '
            const fs = require("node:fs");
            const html = fs.readFileSync("test-results/odhin/common-lib-playwright.html", "utf8");
            const chart = fs.readFileSync("test-results/odhin/js/chartjs.js", "utf8");
            if (!html.includes("odhin-feature-summary") || chart.includes("chart-file")) {
              throw new Error("Odhín dashboard enhancement or external chart asset is incomplete");
            }
          '
          cp test-results/odhin/common-lib-playwright.html test-results/odhin/index.html
      - name: Configure GitHub Pages
        id: configure_pages
        if: always() && steps.odhin_prepare.outcome == 'success'
        uses: actions/configure-pages@v5
      - name: Upload Odhín site
        id: odhin_site
        if: always() && steps.configure_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: test-results/odhin

  publish-odhin:
    if: always() && needs.build.outputs.odhin_artifact_ready == 'true' && github.event_name == 'pull_request' && github.event.pull_request.number == 568 && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Odhín report
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Link report in Actions
        run: |
          printf '### [Open Odhín report](%s)\n' '${{ steps.deployment.outputs.page_url }}' >> "$GITHUB_STEP_SUMMARY"
          printf 'This public Pages URL shows the latest PR #568 report. [Download this run’s exact evidence](%s).\n' '${{ needs.build.outputs.evidence_url }}' >> "$GITHUB_STEP_SUMMARY"

  publish-npm:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org/
      - run: corepack enable && yarn --version
      - run: yarn install
      - run: yarn build:library

      - name: Ensure npm version (Trusted Publishing)
        run: |
          npm --version
          npm i -g npm@11.5.1
          npm --version

      - name: Determine npm dist-tag from GitHub Release
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "NPM_TAG=next" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
          fi
      
      - name: Publish version (OIDC via npm)
        working-directory: dist/exui-common-lib
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          # Ensure we do NOT publish using token-based auth (classic/granular).
          unset NODE_AUTH_TOKEN

          # Use a fresh npm user config with no auth token to force OIDC Trusted Publishing.
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-noauth"
          printf "registry=https://registry.npmjs.org/\nprovenance=false\n" > "$NPM_CONFIG_USERCONFIG"

          # Defensive: remove any auth token entries if something tries to inject them.
          npm config delete //registry.npmjs.org/:_authToken || true
          npm config delete _authToken || true

          npm publish --access public --tag "$NPM_TAG" --ignore-scripts

  publish-gpr:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          registry-url: https://npm.pkg.github.com/
          scope: '@hmcts'
      - run: corepack enable && yarn --version
      - run: yarn install
      - run: yarn build
      - name: Pack dist as npm tarball
        id: pack
        run: |
          cd dist/exui-common-lib
          TAR=$(npm pack)
          echo "tarball=dist/exui-common-lib/$TAR" >> $GITHUB_OUTPUT
      - name: Attach tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.tarball }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
