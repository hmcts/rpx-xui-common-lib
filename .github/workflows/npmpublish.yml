name: Node.js Package

on:
  pull_request:
    branches:
      - master
      - Release
  push:
    branches:
      - master
      - Release
  release:
    types:
      - created

concurrency:
  group: commonlib-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      evidence_url: ${{ steps.playwright_evidence.outputs.artifact-url }}
      odhin_artifact_ready: ${{ steps.odhin_prepare.outcome == 'success' }}
      run_key: ${{ steps.odhin_context.outputs.run_key }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Determine Odhín report context
        id: odhin_context
        run: |
          echo "run_key=${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
      - run: corepack enable && yarn --version
      - run: yarn install
      - run: yarn lint
      - run: yarn build:library
      - run: yarn test
      - run: yarn test:e2e:typecheck
      - run: yarn node --test e2e/reporters/odhin-site-publisher.node-check.cjs
      - run: yarn node --test e2e/reporters/odhin-report-enhancer.node-check.cjs
      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium firefox webkit
      - name: Run Playwright smoke
        env:
          PLAYWRIGHT_REPORTERS: dot,html,junit,odhin
          PW_ODHIN_OUTPUT: test-results/odhin
          PW_ODHIN_INDEX: common-lib-playwright.html
        run: yarn playwright test
      - name: Verify rendered Odhín dashboard
        id: odhin_browser
        if: ${{ !cancelled() && hashFiles('test-results/odhin/common-lib-playwright.html') != '' }}
        run: yarn node e2e/reporters/odhin-report.browser-check.cjs
      - name: Upload Playwright evidence
        id: playwright_evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-lib-playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

      - name: Prepare Odhín site
        id: odhin_prepare
        if: >-
          ${{ !cancelled() && steps.odhin_browser.outcome == 'success' &&
          ((github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'Release')) ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
          hashFiles('test-results/odhin/common-lib-playwright.html') != '' }}
        run: |
          test -s test-results/odhin/common-lib-playwright.html
          node -e '
            const fs = require("node:fs");
            const html = fs.readFileSync("test-results/odhin/common-lib-playwright.html", "utf8");
            const chart = fs.readFileSync("test-results/odhin/js/chartjs.js", "utf8");
            const css = fs.readFileSync("test-results/odhin/presentation/report.css", "utf8");
            const featureCss = fs.readFileSync("test-results/odhin/presentation/feature.css", "utf8");
            const script = fs.readFileSync("test-results/odhin/presentation/report.js", "utf8");
            if (!html.includes("odhin-feature-summary") || !html.includes("./presentation/report.css") || !html.includes("./presentation/feature.css") || !html.includes("./presentation/report.js") || !css.includes("report-metrics") || !featureCss.includes("odhin-feature-summary") || !script.includes("Tests in this run") || html.includes("id=\"odhin-enhancer-styles\"") || html.includes("data:image/") || chart.includes("chart-file")) {
              throw new Error("Odhín dashboard or its external presentation assets are incomplete");
            }
          '

  publish-odhin:
    if: >-
      ${{ needs.build.result == 'success' && needs.build.outputs.odhin_artifact_ready == 'true' &&
      ((github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'Release')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: commonlib-odhin-publication
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ format('{0}{1}', steps.deployment.outputs.page_url, steps.publish_report.outputs.run_url_path) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
      - name: Download exact Playwright evidence
        uses: actions/download-artifact@v4
        with:
          name: common-lib-playwright-evidence
          path: evidence
      - name: Prepare and persist Odhín branch history
        id: publish_report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ODHIN_BRANCH: ${{ github.head_ref || github.ref_name }}
          ODHIN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ODHIN_RUN_KEY: ${{ needs.build.outputs.run_key }}
        run: |
          set -euo pipefail
          report_repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          if git -c http.extraheader="$auth_header" ls-remote --exit-code --heads "$report_repo_url" odhin-reports >/dev/null 2>&1; then
            git -c http.extraheader="$auth_header" clone --branch odhin-reports --single-branch "$report_repo_url" odhin-site
          else
            git init -b odhin-reports odhin-site
            git -C odhin-site remote add origin "$report_repo_url"
          fi
          publisher_result=$(node e2e/reporters/odhin-site-publisher.cjs \
            --source evidence/test-results/odhin \
            --site odhin-site \
            --branch "$ODHIN_BRANCH" \
            --run-key "$ODHIN_RUN_KEY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --sha "$ODHIN_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT")
          printf '%s\n' "$publisher_result"
          report_paths=$(printf '%s' "$publisher_result" | node -e '
            let input = "";
            process.stdin.on("data", chunk => { input += chunk; });
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              process.stdout.write(`branch_url_path=${result.branchUrlPath}\nrun_url_path=${result.runUrlPath}`);
            });
          ')
          printf '%s\n' "$report_paths" >> "$GITHUB_OUTPUT"
          git -C odhin-site config user.name github-actions[bot]
          git -C odhin-site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C odhin-site add .nojekyll reports index.html
          git -C odhin-site commit -m "ci: publish Odhín $ODHIN_BRANCH $ODHIN_RUN_KEY"
          git -c http.extraheader="$auth_header" -C odhin-site push origin HEAD:odhin-reports
          mkdir pages-site
          cp -R odhin-site/. pages-site/
          rm -rf pages-site/.git
      - name: Configure GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@v5
      - name: Upload Odhín site
        id: odhin_site
        if: ${{ !cancelled() && steps.configure_pages.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site
      - name: Publish Odhín report
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Link report in Actions
        env:
          ODHIN_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          pages_url='${{ steps.deployment.outputs.page_url }}'
          pages_url="${pages_url%/}"
          branch_url="$pages_url/${{ steps.publish_report.outputs.branch_url_path }}"
          run_url="$pages_url/${{ steps.publish_report.outputs.run_url_path }}"
          printf '### [Open latest Odhín dashboard for %s](%s)\n' "$ODHIN_BRANCH" "$run_url" >> "$GITHUB_STEP_SUMMARY"
          printf '[Open branch report history](%s)\n\n' "$branch_url" >> "$GITHUB_STEP_SUMMARY"
          printf '[Download this run’s exact evidence](%s).\n' '${{ needs.build.outputs.evidence_url }}' >> "$GITHUB_STEP_SUMMARY"

  publish-npm:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org/
      - run: corepack enable && yarn --version
      - run: yarn install
      - run: yarn build:library

      - name: Ensure npm version (Trusted Publishing)
        run: |
          npm --version
          npm i -g npm@11.5.1
          npm --version

      - name: Determine npm dist-tag from GitHub Release
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "NPM_TAG=next" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
          fi
      
      - name: Publish version (OIDC via npm)
        working-directory: dist/exui-common-lib
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: |
          # Ensure we do NOT publish using token-based auth (classic/granular).
          unset NODE_AUTH_TOKEN

          # Use a fresh npm user config with no auth token to force OIDC Trusted Publishing.
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-noauth"
          printf "registry=https://registry.npmjs.org/\nprovenance=false\n" > "$NPM_CONFIG_USERCONFIG"

          # Defensive: remove any auth token entries if something tries to inject them.
          npm config delete //registry.npmjs.org/:_authToken || true
          npm config delete _authToken || true

          npm publish --access public --tag "$NPM_TAG" --ignore-scripts

  publish-gpr:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          registry-url: https://npm.pkg.github.com/
          scope: '@hmcts'
      - run: corepack enable && yarn --version
      - run: yarn install
      - run: yarn build
      - name: Pack dist as npm tarball
        id: pack
        run: |
          cd dist/exui-common-lib
          TAR=$(npm pack)
          echo "tarball=dist/exui-common-lib/$TAR" >> $GITHUB_OUTPUT
      - name: Attach tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.tarball }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
