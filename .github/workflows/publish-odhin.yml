name: Publish CommonLib Odhín evidence

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact successful or failed Playwright source run to publish
        required: true
        type: string
  workflow_run:
    workflows:
      - Node.js Package
      - CommonLib accessibility (advisory)
      - CommonLib cross-browser (advisory)
    types:
      - completed

concurrency:
  group: commonlib-odhin-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-odhin:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
      ( (github.event.workflow_run.name == 'Node.js Package' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') &&
      (github.event.workflow_run.event == 'pull_request' ||
      (github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'master' || github.event.workflow_run.head_branch == 'Release')))) ||
      (github.event.workflow_run.name == 'CommonLib accessibility (advisory)' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.conclusion == 'success') ||
      (github.event.workflow_run.name == 'CommonLib cross-browser (advisory)' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') ) ) ) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ format('{0}{1}', steps.deployment.outputs.page_url, steps.publish_report.outputs.run_url_path) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Resolve and validate exact source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" | node -e '
            const fs = require("node:fs");
            const run = JSON.parse(fs.readFileSync(0, "utf8"));
            const reports = {
              "Node.js Package": ["functional", "common-lib-functional-report"],
              "CommonLib accessibility (advisory)": ["accessibility", "common-lib-accessibility-report"],
              "CommonLib cross-browser (advisory)": ["cross-browser", "common-lib-cross-browser-report"],
            };
            const report = reports[run.name];
            if (run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY) {
              throw new Error("Source run must belong to this repository");
            }
            if (!report) throw new Error(`Unsupported Odhín source workflow: ${run.name}`);
            if (!["success", "failure"].includes(run.conclusion)) {
              throw new Error(`Source run must be completed with success or failure, got: ${run.conclusion}`);
            }
            const output = {
              source_run_id: run.id,
              source_run_attempt: run.run_attempt,
              source_branch: run.head_branch,
              source_sha: run.head_sha,
              source_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${run.id}/attempts/${run.run_attempt}`,
              report_type: report[0],
              artifact_name: report[1],
            };
            for (const [key, value] of Object.entries(output)) console.log(`${key}=${value}`);
          ' >> "$GITHUB_OUTPUT"
      - name: Check exact upstream report is available
        id: upstream_report
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_ARTIFACT: ${{ steps.source.outputs.artifact_name }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" | node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(0, "utf8"));
            const artifact = report.artifacts.find(({ name, expired }) => name === process.env.REPORT_ARTIFACT && !expired);
            if (artifact) process.stdout.write(String(artifact.id));
          ')"
          if [ -z "$artifact_id" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            printf '### Odhín publication skipped\n\nNo publishable `%s` artifact was produced by [the triggering run](%s/%s/actions/runs/%s).\n' \
              "$REPORT_ARTIFACT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Download exact upstream report
        if: ${{ steps.upstream_report.outputs.available == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: evidence
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Prepare and persist immutable Odhín history
        if: ${{ steps.upstream_report.outputs.available == 'true' }}
        id: publish_report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ODHIN_BRANCH: ${{ steps.source.outputs.source_branch }}
          ODHIN_SHA: ${{ steps.source.outputs.source_sha }}
          ODHIN_RUN_KEY: ${{ steps.source.outputs.source_run_id }}-attempt-${{ steps.source.outputs.source_run_attempt }}
          ODHIN_SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          ODHIN_SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source_run_attempt }}
          ODHIN_RUN_URL: ${{ steps.source.outputs.source_url }}
          ODHIN_REPORT_TYPE: ${{ steps.source.outputs.report_type }}
        run: |
          set -euo pipefail
          if [ "$ODHIN_REPORT_TYPE" != 'functional' ]; then
            test -s evidence/odhin-source.json
            ODHIN_BRANCH="$(node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0, "utf8")).rawBranch)' < evidence/odhin-source.json)"
            ODHIN_SHA="$(node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0, "utf8")).sha)' < evidence/odhin-source.json)"
            rm evidence/odhin-source.json
          fi
          report_repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          if git -c http.extraheader="$auth_header" ls-remote --exit-code --heads "$report_repo_url" odhin-reports >/dev/null 2>&1; then
            git -c http.extraheader="$auth_header" clone --branch odhin-reports --single-branch "$report_repo_url" odhin-site
          else
            git init -b odhin-reports odhin-site
            git -C odhin-site remote add origin "$report_repo_url"
          fi
          publisher_result=$(node e2e/reporters/odhin-site-publisher.cjs \
            --source evidence \
            --site odhin-site \
            --branch "$ODHIN_BRANCH" \
            --run-key "$ODHIN_RUN_KEY" \
            --run-id "$ODHIN_SOURCE_RUN_ID" \
            --run-attempt "$ODHIN_SOURCE_RUN_ATTEMPT" \
            --sha "$ODHIN_SHA" \
            --run-url "$ODHIN_RUN_URL" \
            --report-type "$ODHIN_REPORT_TYPE")
          printf '%s\n' "$publisher_result"
          node e2e/reporters/odhin-site-publisher.cjs \
            --source evidence \
            --site pages-site \
            --branch "$ODHIN_BRANCH" \
            --run-key "$ODHIN_RUN_KEY" \
            --run-id "$ODHIN_SOURCE_RUN_ID" \
            --run-attempt "$ODHIN_SOURCE_RUN_ATTEMPT" \
            --sha "$ODHIN_SHA" \
            --run-url "$ODHIN_RUN_URL" \
            --report-type "$ODHIN_REPORT_TYPE" \
            --latest-only true >/dev/null
          printf '%s' "$publisher_result" | node -e '
            let input = "";
            process.stdin.on("data", chunk => { input += chunk; });
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              process.stdout.write(`branch_url_path=${result.branchUrlPath}\nrun_url_path=${result.runUrlPath}\n`);
            });
          ' >> "$GITHUB_OUTPUT"
          git -C odhin-site config user.name github-actions[bot]
          git -C odhin-site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C odhin-site add .nojekyll reports index.html
          git -C odhin-site commit -m "ci: publish Odhín $ODHIN_BRANCH $ODHIN_RUN_KEY"
          git -c http.extraheader="$auth_header" -C odhin-site push origin HEAD:odhin-reports
      - name: Configure GitHub Pages
        if: ${{ steps.upstream_report.outputs.available == 'true' }}
        id: configure_pages
        uses: actions/configure-pages@v6
      - name: Upload Odhín site
        if: ${{ steps.upstream_report.outputs.available == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site
      - name: Publish Odhín report
        if: ${{ steps.upstream_report.outputs.available == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Link report in Actions
        if: ${{ steps.upstream_report.outputs.available == 'true' }}
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          REPORT_TYPE: ${{ steps.source.outputs.report_type }}
          BRANCH_PATH: ${{ steps.publish_report.outputs.branch_url_path }}
          RUN_PATH: ${{ steps.publish_report.outputs.run_url_path }}
          UPSTREAM_URL: ${{ steps.source.outputs.source_url }}
        run: |
          pages_url="${PAGES_URL%/}"
          printf '### Published %s Odhín evidence\n\n' "$REPORT_TYPE" >> "$GITHUB_STEP_SUMMARY"
          printf '[Open current public report](%s/%s)\n\n' "$pages_url" "$RUN_PATH" >> "$GITHUB_STEP_SUMMARY"
          printf '[Open immutable report archive](%s/%s)\n\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/odhin-reports" "$RUN_PATH" >> "$GITHUB_STEP_SUMMARY"
          printf '[Open the triggering workflow evidence](%s).\n' "$UPSTREAM_URL" >> "$GITHUB_STEP_SUMMARY"
