name: Publish CommonLib Odhín evidence

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Report artifact from the calling workflow
        required: true
        type: string
      evidence_url:
        description: Optional raw evidence artifact URL
        required: false
        type: string
      report_type:
        description: Odhín report type to publish
        required: true
        type: string

concurrency:
  group: commonlib-odhin-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-odhin:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ format('{0}{1}', steps.deployment.outputs.page_url, steps.publish_report.outputs.run_url_path) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Download exact Odhín report
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: evidence
      - name: Prepare and persist immutable Odhín history
        id: publish_report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ODHIN_BRANCH: ${{ github.head_ref || github.ref_name }}
          ODHIN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ODHIN_RUN_KEY: ${{ github.run_id }}-attempt-${{ github.run_attempt }}
          ODHIN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          ODHIN_REPORT_TYPE: ${{ inputs.report_type }}
        run: |
          set -euo pipefail
          case "$ODHIN_REPORT_TYPE" in
            functional|accessibility) ;;
            *) echo "Unsupported Odhín report type: $ODHIN_REPORT_TYPE" >&2; exit 1 ;;
          esac
          if [ "$ODHIN_REPORT_TYPE" = 'accessibility' ]; then
            test -s evidence/odhin-source.json
            ODHIN_BRANCH="$(node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0, "utf8")).rawBranch)' < evidence/odhin-source.json)"
            ODHIN_SHA="$(node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0, "utf8")).sha)' < evidence/odhin-source.json)"
            rm evidence/odhin-source.json
          fi
          report_repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          if git -c http.extraheader="$auth_header" ls-remote --exit-code --heads "$report_repo_url" odhin-reports >/dev/null 2>&1; then
            git -c http.extraheader="$auth_header" clone --branch odhin-reports --single-branch "$report_repo_url" odhin-site
          else
            git init -b odhin-reports odhin-site
            git -C odhin-site remote add origin "$report_repo_url"
          fi
          publisher_result=$(node e2e/reporters/odhin-site-publisher.cjs \
            --source evidence \
            --site odhin-site \
            --branch "$ODHIN_BRANCH" \
            --run-key "$ODHIN_RUN_KEY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --sha "$ODHIN_SHA" \
            --run-url "$ODHIN_RUN_URL" \
            --report-type "$ODHIN_REPORT_TYPE")
          printf '%s\n' "$publisher_result"
          printf '%s' "$publisher_result" | node -e '
            let input = "";
            process.stdin.on("data", chunk => { input += chunk; });
            process.stdin.on("end", () => {
              const result = JSON.parse(input);
              process.stdout.write(`branch_url_path=${result.branchUrlPath}\nrun_url_path=${result.runUrlPath}\n`);
            });
          ' >> "$GITHUB_OUTPUT"
          git -C odhin-site config user.name github-actions[bot]
          git -C odhin-site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C odhin-site add .nojekyll reports index.html
          git -C odhin-site commit -m "ci: publish Odhín $ODHIN_BRANCH $ODHIN_RUN_KEY"
          git -c http.extraheader="$auth_header" -C odhin-site push origin HEAD:odhin-reports
          mkdir pages-site
          cp -R odhin-site/. pages-site/
          rm -rf pages-site/.git
      - name: Configure GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@v6
      - name: Upload Odhín site
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site
      - name: Publish Odhín report
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Link report in Actions
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          REPORT_TYPE: ${{ inputs.report_type }}
          BRANCH_PATH: ${{ steps.publish_report.outputs.branch_url_path }}
          RUN_PATH: ${{ steps.publish_report.outputs.run_url_path }}
          EVIDENCE_URL: ${{ inputs.evidence_url }}
        run: |
          pages_url="${PAGES_URL%/}"
          printf '### Published %s Odhín evidence\n\n' "$REPORT_TYPE" >> "$GITHUB_STEP_SUMMARY"
          printf '[Open this immutable report](%s/%s)\n\n' "$pages_url" "$RUN_PATH" >> "$GITHUB_STEP_SUMMARY"
          printf '[Open this report type’s branch history](%s/%s)\n\n' "$pages_url" "$BRANCH_PATH" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$EVIDENCE_URL" ]; then
            printf '[Download this run’s exact evidence](%s).\n' "$EVIDENCE_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
