<nav class="govuk-pagination govuk-pagination--block" [attr.aria-label]="'Pagination' | rpxTranslate">
  <div class="govuk-pagination__prev">
    @if (firstRecord > 1) {
      <a [routerLink]="" class="govuk-link govuk-pagination__link" rel="prev"
        (keyup.enter)="onPrevious()" (click)="onPrevious(); $event?.preventDefault()">
        <svg class="govuk-pagination__icon govuk-pagination__icon--prev" xmlns="http://www.w3.org/2000/svg" height="13" width="15" aria-hidden="true" focusable="false" viewBox="0 0 15 13">
          <path d="m6.5938-0.0078125-6.7266 6.7266 6.7441 6.4062 1.377-1.449-4.1856-3.9768h12.896v-2h-12.984l4.2931-4.293-1.414-1.414z"></path>
        </svg>
        <span class="govuk-pagination__link-title govuk-pagination__link-title--decorated">{{'Previous' | rpxTranslate}}<span class="govuk-visually-hidden"> {{'page' | rpxTranslate}}</span></span>
      </a>
    } @else {
      <span class="govuk-pagination__link">{{'Previous page' | rpxTranslate}}</span>
    }
  </div>

  <div class="govuk-pagination__next">
    @if (moreItems) {
      <a [routerLink]="" class="govuk-link govuk-pagination__link" rel="next"
        (keyup.enter)="onNext()" (click)="onNext(); $event?.preventDefault()">
        <span class="govuk-pagination__link-title govuk-pagination__link-title--decorated">{{'Next' | rpxTranslate}}<span class="govuk-visually-hidden"> {{'page' | rpxTranslate}}</span></span>
        <svg class="govuk-pagination__icon govuk-pagination__icon--next" xmlns="http://www.w3.org/2000/svg" height="13" width="15" aria-hidden="true" focusable="false" viewBox="0 0 15 13">
          <path d="m8.107-0.0078125-1.4136 1.414 4.2926 4.293h-12.986v2h12.896l-4.1855 3.9766 1.377 1.4492 6.7441-6.4062-6.7246-6.7266z"></path>
        </svg>
      </a>
    } @else {
      <span class="govuk-pagination__link">{{'Next page' | rpxTranslate}}</span>
    }
  </div>
</nav>
